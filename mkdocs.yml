site_name: AWS & Infrastructure – Practical Work
site_description: Practical AWS and Linux infrastructure documentation

# Set this to your GitHub Pages URL after creating the repository, for example:
# https://YOUR-USERNAME.github.io/AWS-Practical-Work/
# site_url: https://YOUR-USERNAME.github.io/AWS-Practical-Work/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Compute and Access:
      - EC2 and IAM S3 Access: projects/01-ec2-iam-s3-access.md
      - EC2 Auto Scaling: projects/04-ec2-auto-scaling.md
      - ECS Fargate Flask: projects/07-ecs-fargate-flask.md
      - Systems Manager Session Manager: projects/12-ssm-session-manager.md
      - EC2 SSH Key Recovery: projects/13-ec2-ssh-key-recovery.md
  - Networking and Delivery:
      - VPC Public and Private Networking: projects/02-vpc-public-private-networking.md
      - ALB HTTPS and Host Routing: projects/03-alb-https-host-routing.md
      - CloudFront with Private S3 Origin: projects/06-cloudfront-private-s3-origin.md
      - Route 53 Private DNS: projects/17-route53-private-dns.md
  - Storage, Database and Serverless:
      - S3 Website and EventBridge: projects/05-s3-static-website-eventbridge.md
      - Private RDS MySQL: projects/08-ec2-private-rds-mysql.md
      - Lambda API and DynamoDB: projects/09-lambda-api-dynamodb.md
  - Infrastructure, Monitoring and Security:
      - CloudFormation VPC: projects/10-cloudformation-vpc.md
      - CloudWatch EC2 Monitoring: projects/11-cloudwatch-ec2-monitoring.md
      - IAM, Organizations and SCP: projects/14-iam-organizations-scp.md
      - Fail2ban EC2 Protection: projects/15-fail2ban-ec2-protection.md
      - Nagios Core and NRPE: projects/16-nagios-core-nrpe-monitoring.md
      - AWS Billing Alerts and Budgets: projects/18-aws-cost-alerts.md
